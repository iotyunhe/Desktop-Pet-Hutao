appId: local.hutao.desktoppet
productName: 胡桃桌宠
copyright: Fan-made local desktop pet
directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

asar: true
electronDist: node_modules/electron/dist
npmRebuild: false

extraResources:
  - from: resources/tray.png
    to: tray.png
  - from: resources/icon.png
    to: icon.png
  # 工作台页面不进 asar，打包后从 resources/workbench/index.html 读取，
  # 方便用户自己改样式而不用重新编译。
  - from: tools/hutao-workbench
    to: workbench

win:
  icon: resources/icon.ico
  # 允许写入版本信息与图标（不配置证书时不会做代码签名）。
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 胡桃桌宠
  artifactName: HuTao-Desktop-Pet-Setup-${version}-${arch}.${ext}

portable:
  artifactName: HuTao-Desktop-Pet-${version}-portable.${ext}
