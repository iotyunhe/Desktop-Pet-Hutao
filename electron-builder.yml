appId: local.hutao.desktoppet
productName: 胡桃桌宠
copyright: Fan-made local desktop pet
directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

asar: true
electronDist: node_modules/electron/dist
npmRebuild: false

extraResources:
  - from: resources/tray.png
    to: tray.png
  - from: resources/icon.png
    to: icon.png

win:
  icon: resources/icon.ico
  # 允许写入版本信息与图标（不配置证书时不会做代码签名）。
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 胡桃桌宠
  artifactName: HuTao-Desktop-Pet-Setup-${version}-${arch}.${ext}

portable:
  artifactName: HuTao-Desktop-Pet-${version}-portable.${ext}
